<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高機能リアルタイムチャット（完全版）</title>
  <!-- CSS & Firebase -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://chat-f805f-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRoom = "";
    let myName = "";
    let myAvatar = "🐱"; // 初期アイコン
    let mutedUsers = JSON.parse(localStorage.getItem('muted_users') || "[]");
    const MAX_MESSAGES = 40;

    // 絵文字アイコン選択
    window.selectAvatar = function(emoji, element) {
      myAvatar = emoji;
      document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('border-primary', 'border-4'));
      element.classList.add('border-primary', 'border-4');
      document.getElementById('custom-avatar-preview').src = "";
    };

    // 自分の写真（画像ファイル）をアイコンに設定
    window.selectCustomAvatar = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 100;
          canvas.height = 100;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 100, 100);
          myAvatar = canvas.toDataURL('image/jpeg', 0.7);

          // プレビュー表示
          document.getElementById('custom-avatar-preview').src = myAvatar;
          document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('border-primary', 'border-4'));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.joinRoom = function() {
      const nameInput = document.getElementById('user-name').value.trim();
      const roomInput = document.getElementById('room-id').value.trim();

      if (!nameInput || !roomInput) {
        alert("名前と部屋番号を入力してください！");
        return;
      }

      myName = nameInput;
      currentRoom = roomInput;

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('room-title').innerText = `部屋番号: ${currentRoom}`;

      const roomRef = ref(db, 'rooms/' + currentRoom);

      onChildAdded(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (data.target && data.target !== myName && data.sender !== myName) {
          return;
        }
        appendMessage(snapshot.key, data.sender, data.avatar || "👤", data.text, data.image, data.target, data.sender === myName);
      });

      onChildRemoved(roomRef, (snapshot) => {
        const msgEl = document.getElementById(`msg-${snapshot.key}`);
        if (msgEl) msgEl.remove();
      });
    };

    window.previewImage = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('preview-img').src = e.target.result;
        document.getElementById('image-preview-area').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    };

    window.cancelImage = function() {
      document.getElementById('image-input').value = "";
      document.getElementById('image-preview-area').classList.add('hidden');
    };

    window.sendMessage = async function(e) {
      e.preventDefault();
      const textInput = document.getElementById('message-input');
      const imageInput = document.getElementById('image-input');
      const targetInput = document.getElementById('dm-target');
      const text = textInput.value.trim();
      const file = imageInput.files[0];
      const target = targetInput.value.trim();

      if (!text && !file) return;
      if (!currentRoom) return;

      let imageBase64 = null;
      if (file) {
        imageBase64 = await resizeAndConvertImage(file);
      }

      const roomRef = ref(db, 'rooms/' + currentRoom);
      await push(roomRef, {
        sender: myName,
        avatar: myAvatar,
        text: text,
        image: imageBase64,
        target: target ? target : null,
        timestamp: Date.now()
      });

      textInput.value = '';
      targetInput.value = '';
      cancelImage();

      const snapshot = await get(roomRef);
      if (snapshot.exists()) {
        const messages = snapshot.val();
        const keys = Object.keys(messages);
        if (keys.length > MAX_MESSAGES) {
          for (let i = 0; i < keys.length - MAX_MESSAGES; i++) {
            await remove(ref(db, `rooms/${currentRoom}/${keys[i]}`));
          }
        }
      }
    };

    function resizeAndConvertImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > 800) { height *= 800 / width; width = 800; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ミュート追加・解除
    window.toggleMute = function(username) {
      if (mutedUsers.includes(username)) {
        mutedUsers = mutedUsers.filter(u => u !== username);
        alert(`${username} のミュートを解除しました`);
      } else {
        mutedUsers.push(username);
        alert(`${username} をミュートしました`);
      }
      localStorage.setItem('muted_users', JSON.stringify(mutedUsers));
      location.reload();
    };

    // ミュート一覧モーダルを開く
    window.openMuteModal = function() {
      const listContainer = document.getElementById('mute-list-container');
      listContainer.innerHTML = "";
      if (mutedUsers.length === 0) {
        listContainer.innerHTML = "<p class='text-gray-400 text-center'>ミュートしているユーザーはありません</p>";
      } else {
        mutedUsers.forEach(user => {
          const item = document.createElement('div');
          item.className = "flex justify-between items-center bg-base-200 p-2 rounded-lg";
          item.innerHTML = `<span>${user}</span> <button onclick="toggleMute('${user}')" class="btn btn-xs btn-error">解除する</button>`;
          listContainer.appendChild(item);
        });
      }
      document.getElementById('mute-modal').showModal();
    };

    window.setDmTarget = function(username) {
      if (username === myName) return;
      document.getElementById('dm-target').value = username;
      alert(`${username} への個別送信（DM）モードに切り替えました。`);
    };

    function appendMessage(key, sender, avatar, text, image, target, isMe) {
      if (mutedUsers.includes(sender)) return;

      const chatMessages = document.getElementById('chat-messages');
      if (document.getElementById(`msg-${key}`)) return;

      const wrapper = document.createElement('div');
      wrapper.id = `msg-${key}`;
      wrapper.className = `chat ${isMe ? 'chat-end' : 'chat-start'}`;

      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'chat-image avatar placeholder';
      
      if (avatar.startsWith('data:image')) {
        avatarDiv.innerHTML = `<div class="w-10 rounded-full"><img src="${avatar}" /></div>`;
      } else {
        avatarDiv.innerHTML = `<div class="bg-neutral text-neutral-content rounded-full w-10 text-lg flex items-center justify-center">${avatar}</div>`;
      }

      const header = document.createElement('div');
      header.className = 'chat-header text-xs opacity-70 mb-1 flex items-center gap-2';
      let targetTag = target ? `<span class="badge badge-xs badge-accent">🔒 ${target}へ</span>` : '';
      header.innerHTML = `<span>${sender}</span> ${targetTag}`;

      if (!isMe) {
        const menuBtn = document.createElement('button');
        menuBtn.className = 'text-[10px] underline opacity-50 hover:opacity-100 ml-1';
        menuBtn.innerText = '⚙️メニュー';
        menuBtn.onclick = () => {
          const action = prompt(`${sender} さんに対する操作:\n1: 個別送信(DM)する\n2: ミュート(非表示)にする`, "1");
          if (action === "1") setDmTarget(sender);
          if (action === "2") toggleMute(sender);
        };
        header.appendChild(menuBtn);
      }

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${isMe ? 'chat-bubble-primary' : 'chat-bubble-secondary'} flex flex-col gap-2`;

      if (text) {
        const textEl = document.createElement('span');
        textEl.textContent = text;
        bubble.appendChild(textEl);
      }

      if (image) {
        const imgEl = document.createElement('img');
        imgEl.src = image;
        imgEl.className = 'max-w-xs rounded-lg shadow-md cursor-pointer';
        imgEl.onclick = () => window.open(image);
        bubble.appendChild(imgEl);
      }

      wrapper.appendChild(avatarDiv);
      wrapper.appendChild(header);
      wrapper.appendChild(bubble);
      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">

  <!-- 入室画面 -->
  <div id="login-screen" class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-center justify-center text-primary font-bold text-2xl mb-4">チャットに参加</h2>
      <div class="form-control gap-3">
        <label class="label"><span class="label-text">あなたの名前</span></label>
        <input type="text" id="user-name" placeholder="例: たろう" class="input input-bordered w-full" />
        
        <label class="label"><span class="label-text">アイコンを選択（絵文字 or 写真）</span></label>
        <div class="flex items-center gap-3">
          <div class="flex gap-1 text-xl">
            <span onclick="selectAvatar('🐱', this)" class="avatar-option cursor-pointer p-2 rounded-xl border border-base-300 border-primary border-4">🐱</span>
            <span onclick="selectAvatar('🐶', this)" class="avatar-option cursor-pointer p-2 rounded-xl border border-base-300">🐶</span>
            <span onclick="selectAvatar('🦊', this)" class="avatar-option cursor-pointer p-2 rounded-xl border border-base-300">🦊</span>
          </div>
          <!-- 写真アップロード用 -->
          <label class="btn btn-sm btn-outline btn-primary cursor-pointer gap-1">
            📷 写真を使う
            <input type="file" accept="image/*" class="hidden" onchange="selectCustomAvatar(event)" />
          </label>
        </div>
        <!-- カスタムアバタープレビュー -->
        <div class="flex items-center gap-2">
          <img id="custom-avatar-preview" class="w-10 h-10 rounded-full object-cover border" />
          <span class="text-xs text-gray-400">（写真を選んだ場合はここに反映されます）</span>
        </div>

        <label class="label"><span class="label-text">部屋番号（合言葉）</span></label>
        <input type="text" id="room-id" placeholder="例: secret123" class="input input-bordered w-full" />
        
        <button onclick="joinRoom()" class="btn btn-primary mt-4 w-full">チャットを開始する</button>
      </div>
    </div>
  </div>

  <!-- チャット画面 -->
  <div id="chat-screen" class="hidden card w-full max-w-2xl bg-base-100 shadow-xl h-[88vh] flex flex-col">
    <div class="p-4 bg-primary text-primary-content font-bold flex justify-between items-center rounded-t-xl">
      <span id="room-title">部屋番号: -</span>
      <div class="flex gap-2">
        <button onclick="openMuteModal()" class="btn btn-xs btn-outline text-white">ミュート一覧</button>
      </div>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <!-- 画像プレビューエリア -->
    <div id="image-preview-area" class="hidden p-2 bg-base-200 border-t flex items-center gap-2">
      <img id="preview-img" class="w-16 h-16 object-cover rounded-lg border" />
      <span class="text-xs text-gray-500 flex-1">送信する画像</span>
      <button type="button" onclick="cancelImage()" class="btn btn-sm btn-circle btn-ghost">✕</button>
    </div>

    <!-- 宛先指定バー（DM用） -->
    <div class="px-3 pt-2 bg-base-100 flex items-center gap-2 text-xs text-gray-500 border-t">
      <span>宛先:</span>
      <input type="text" id="dm-target" placeholder="全体送信（空欄なら全員に見えます）" class="input input-xs input-bordered flex-1" readonly />
      <button onclick="document.getElementById('dm-target').value=''" class="btn btn-xs btn-ghost">全体に戻す</button>
    </div>

    <!-- 入力フォーム -->
    <form onsubmit="sendMessage(event)" class="p-3 bg-base-100 flex items-center gap-2 rounded-b-xl">
      <label class="btn btn-ghost btn-circle cursor-pointer">
        📷
        <input type="file" id="image-input" accept="image/*" class="hidden" onchange="previewImage(event)" />
      </label>

      <input type="text" id="message-input" placeholder="メッセージを入力..." class="input input-bordered flex-1" autocomplete="off" />
      <button type="submit" class="btn btn-primary">送信</button>
    </form>
  </div>

  <!-- ミュート一覧モーダル -->
  <dialog id="mute-modal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">ミュートしているユーザー一覧</h3>
      <div id="mute-list-container" class="space-y-2 mb-4">
        <!-- JSでここにリストが挿入されます -->
      </div>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn">閉じる</button>
        </form>
      </div>
    </div>
  </dialog>

</body>
</html>
