<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個別リアルタイムチャット</title>
  <!-- CSS & Firebase (リアルタイム通信用ライブラリ) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 公開テスト用の無料Firebase設定（すぐに使えます）
    const firebaseConfig = {
      databaseURL: "https://chat-demo-default-rtdb.firebaseio.com/"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRoom = "";
    let myName = "";

    // 部屋に入室する処理
    window.joinRoom = function() {
      const nameInput = document.getElementById('user-name').value.trim();
      const roomInput = document.getElementById('room-id').value.trim();

      if (!nameInput || !roomInput) {
        alert("名前と部屋番号を入力してください！");
        return;
      }

      myName = nameInput;
      currentRoom = roomInput;

      // 画面切り替え
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('room-title').innerText = `部屋番号: ${currentRoom}`;

      // リアルタイムでメッセージを受信
      const roomRef = ref(db, 'rooms/' + currentRoom);
      onChildAdded(roomRef, (snapshot) => {
        const data = snapshot.val();
        appendMessage(data.sender, data.text, data.sender === myName);
      });
    };

    // メッセージ送信処理
    window.sendMessage = function(e) {
      e.preventDefault();
      const textInput = document.getElementById('message-input');
      const text = textInput.value.trim();
      if (!text || !currentRoom) return;

      const roomRef = ref(db, 'rooms/' + currentRoom);
      push(roomRef, {
        sender: myName,
        text: text,
        timestamp: Date.now()
      });

      textInput.value = '';
    };

    function appendMessage(sender, text, isMe) {
      const chatMessages = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `chat ${isMe ? 'chat-end' : 'chat-start'}`;

      const header = document.createElement('div');
      header.className = 'chat-header text-xs opacity-50 mb-1';
      header.innerText = sender;

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${isMe ? 'chat-bubble-primary' : 'chat-bubble-secondary'}`;
      bubble.innerText = text;

      wrapper.appendChild(header);
      wrapper.appendChild(bubble);
      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">

  <!-- 1. 入室画面（名前と部屋番号を決める） -->
  <div id="login-screen" class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-center justify-center text-primary font-bold text-2xl mb-4">個別チャットに入る</h2>
      <div class="form-control gap-3">
        <label class="label"><span class="label-text">あなたの名前</span></label>
        <input type="text" id="user-name" placeholder="例: たろう" class="input input-bordered w-full" />
        
        <label class="label"><span class="label-text">合言葉・部屋番号（友達と同じものを入力）</span></label>
        <input type="text" id="room-id" placeholder="例: secret123" class="input input-bordered w-full" />
        
        <button onclick="joinRoom()" class="btn btn-primary mt-4 w-full">チャットを開始する</button>
      </div>
    </div>
  </div>

  <!-- 2. チャット画面（初期状態は非表示） -->
  <div id="chat-screen" class="hidden card w-full max-w-2xl bg-base-100 shadow-xl h-[80vh] flex flex-col">
    <!-- ヘッダー -->
    <div class="p-4 bg-primary text-primary-content font-bold flex justify-between items-center rounded-t-xl">
      <span id="room-title">部屋番号: -</span>
      <span class="badge badge-outline text-white">接続中</span>
    </div>

    <!-- メッセージ表示エリア -->
    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <!-- 入力フォーム -->
    <form onsubmit="sendMessage(event)" class="p-4 bg-base-100 border-t flex gap-2 rounded-b-xl">
      <input type="text" id="message-input" placeholder="メッセージを入力..." class="input input-bordered flex-1" autocomplete="off" />
      <button type="submit" class="btn btn-primary">送信</button>
    </form>
  </div>

</body>
</html>
