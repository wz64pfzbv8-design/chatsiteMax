<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web App Chat</title>
  <!-- CSS (Tailwind & DaisyUI) を外部CDNから安全に読み込み -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/theme-change@2.0.2/index.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="navbar bg-base-100 shadow-md px-4">
    <div class="flex-1">
      <a class="btn btn-ghost normal-case text-xl font-bold text-primary">Web App Chat</a>
    </div>
    <div class="flex-none gap-2">
      <span class="badge badge-success gap-1">
        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> オンライン
      </span>
    </div>
  </header>

  <!-- チャットメッセージエリア -->
  <main class="flex-1 overflow-y-auto p-4 max-w-3xl w-full mx-auto space-y-4" id="chat-messages">
    <!-- AI/システムの初期メッセージ -->
    <div class="chat chat-start">
      <div class="chat-image avatar">
        <div class="w-10 rounded-full bg-primary text-primary-content flex items-center justify-center font-bold">
          AI
        </div>
      </div>
      <div class="chat-header mb-1 text-xs opacity-50">システム</div>
      <div class="chat-bubble chat-bubble-primary">こんにちは！何かお手伝いできることはありますか？</div>
    </div>
  </main>

  <!-- メッセージ入力フォーム -->
  <footer class="p-4 bg-base-100 border-t border-base-300">
    <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
      <input 
        type="text" 
        id="user-input" 
        placeholder="メッセージを入力..." 
        class="input input-bordered flex-1 focus:outline-none" 
        autocomplete="off"
        required
      />
      <button type="submit" class="btn btn-primary">
        送信
      </button>
    </form>
  </footer>

  <!-- JavaScript（動作処理） -->
  <script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');

    // メッセージ送信時の処理
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // 1. ユーザーのメッセージを表示
      appendMessage(text, 'user');
      userInput.value = '';

      // 2. 自動返信のテスト表示 (500ms後)
      setTimeout(() => {
        appendMessage(`「${text}」を受け取りました！`, 'bot');
      }, 500);
    });

    // 画面にチャットバブルを追加する関数
    function appendMessage(text, sender) {
      const isUser = sender === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `chat ${isUser ? 'chat-end' : 'chat-start'}`;

      const avatar = document.createElement('div');
      avatar.className = 'chat-image avatar';
      avatar.innerHTML = `<div class="w-10 rounded-full ${isUser ? 'bg-secondary' : 'bg-primary'} text-white flex items-center justify-center font-bold">${isUser ? 'YOU' : 'AI'}</div>`;

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${isUser ? 'chat-bubble-secondary' : 'chat-bubble-primary'}`;
      bubble.textContent = text;

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      chatMessages.appendChild(wrapper);

      // 一番下まで自動スクロール
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>
