<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個別リアルタイムチャット（写真送信対応）</title>
  <!-- CSS & Firebase -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://chat-f805f-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRoom = "";
    let myName = "";
    const MAX_MESSAGES = 30;

    window.joinRoom = function() {
      const nameInput = document.getElementById('user-name').value.trim();
      const roomInput = document.getElementById('room-id').value.trim();

      if (!nameInput || !roomInput) {
        alert("名前と部屋番号を入力してください！");
        return;
      }

      myName = nameInput;
      currentRoom = roomInput;

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('room-title').innerText = `部屋番号: ${currentRoom}`;

      const roomRef = ref(db, 'rooms/' + currentRoom);

      onChildAdded(roomRef, (snapshot) => {
        const data = snapshot.val();
        appendMessage(snapshot.key, data.sender, data.text, data.image, data.sender === myName);
      });

      onChildRemoved(roomRef, (snapshot) => {
        const msgEl = document.getElementById(`msg-${snapshot.key}`);
        if (msgEl) msgEl.remove();
      });
    };

    // 画像選択時にプレビュー表示
    window.previewImage = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const previewArea = document.getElementById('image-preview-area');
        const previewImg = document.getElementById('preview-img');
        previewImg.src = e.target.result;
        previewArea.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    };

    // プレビューキャンセル
    window.cancelImage = function() {
      document.getElementById('image-input').value = "";
      document.getElementById('image-preview-area').classList.add('hidden');
    };

    // メッセージ（テキストまたは画像）送信処理
    window.sendMessage = async function(e) {
      e.preventDefault();
      const textInput = document.getElementById('message-input');
      const imageInput = document.getElementById('image-input');
      const text = textInput.value.trim();
      const file = imageInput.files[0];

      if (!text && !file) return;
      if (!currentRoom) return;

      let imageBase64 = null;

      if (file) {
        // 画像を圧縮・変換してBase64にする
        imageBase64 = await resizeAndConvertImage(file);
      }

      const roomRef = ref(db, 'rooms/' + currentRoom);

      await push(roomRef, {
        sender: myName,
        text: text,
        image: imageBase64,
        timestamp: Date.now()
      });

      // フォームをリセット
      textInput.value = '';
      cancelImage();

      // 自動削除処理
      const snapshot = await get(roomRef);
      if (snapshot.exists()) {
        const messages = snapshot.val();
        const keys = Object.keys(messages);
        if (keys.length > MAX_MESSAGES) {
          const deleteCount = keys.length - MAX_MESSAGES;
          for (let i = 0; i < deleteCount; i++) {
            await remove(ref(db, `rooms/${currentRoom}/${keys[i]}`));
          }
        }
      }
    };

    // 画像を縮小して通信量を抑えるヘルパー関数
    function resizeAndConvertImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800; // 最大横幅
            const MAX_HEIGHT = 800; // 最大縦幅
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // JPEG形式で圧縮（画質0.7）
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function appendMessage(key, sender, text, image, isMe) {
      const chatMessages = document.getElementById('chat-messages');
      if (document.getElementById(`msg-${key}`)) return;

      const wrapper = document.createElement('div');
      wrapper.id = `msg-${key}`;
      wrapper.className = `chat ${isMe ? 'chat-end' : 'chat-start'}`;

      const header = document.createElement('div');
      header.className = 'chat-header text-xs opacity-50 mb-1';
      header.innerText = sender;

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${isMe ? 'chat-bubble-primary' : 'chat-bubble-secondary'} flex flex-col gap-2`;

      if (text) {
        const textEl = document.createElement('span');
        textEl.textContent = text;
        bubble.appendChild(textEl);
      }

      if (image) {
        const imgEl = document.createElement('img');
        imgEl.src = image;
        imgEl.className = 'max-w-xs rounded-lg shadow-md cursor-pointer';
        imgEl.onclick = () => window.open(image); // クリックで拡大表示
        bubble.appendChild(imgEl);
      }

      wrapper.appendChild(header);
      wrapper.appendChild(bubble);
      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">

  <!-- 入室画面 -->
  <div id="login-screen" class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-center justify-center text-primary font-bold text-2xl mb-4">個別チャットに入る</h2>
      <div class="form-control gap-3">
        <label class="label"><span class="label-text">あなたの名前</span></label>
        <input type="text" id="user-name" placeholder="例: たろう" class="input input-bordered w-full" />
        
        <label class="label"><span class="label-text">合言葉・部屋番号（友達と同じものを入力）</span></label>
        <input type="text" id="room-id" placeholder="例: secret123" class="input input-bordered w-full" />
        
        <button onclick="joinRoom()" class="btn btn-primary mt-4 w-full">チャットを開始する</button>
      </div>
    </div>
  </div>

  <!-- チャット画面 -->
  <div id="chat-screen" class="hidden card w-full max-w-2xl bg-base-100 shadow-xl h-[85vh] flex flex-col">
    <div class="p-4 bg-primary text-primary-content font-bold flex justify-between items-center rounded-t-xl">
      <span id="room-title">部屋番号: -</span>
      <span class="badge badge-outline text-white">写真・自動削除対応</span>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <!-- 画像プレビューエリア -->
    <div id="image-preview-area" class="hidden p-2 bg-base-200 border-t flex items-center gap-2">
      <img id="preview-img" class="w-16 h-16 object-cover rounded-lg border" />
      <span class="text-xs text-gray-500 flex-1">送信する画像</span>
      <button type="button" onclick="cancelImage()" class="btn btn-sm btn-circle btn-ghost">✕</button>
    </div>

    <!-- 入力フォーム -->
    <form onsubmit="sendMessage(event)" class="p-3 bg-base-100 border-t flex items-center gap-2 rounded-b-xl">
      <!-- 画像ファイル選択ボタン -->
      <label class="btn btn-ghost btn-circle cursor-pointer">
        📷
        <input type="file" id="image-input" accept="image/*" class="hidden" onchange="previewImage(event)" />
      </label>

      <input type="text" id="message-input" placeholder="メッセージまたは写真を入力..." class="input input-bordered flex-1" autocomplete="off" />
      <button type="submit" class="btn btn-primary">送信</button>
    </form>
  </div>

</body>
</html>
